<!DOCTYPE html>
<!--
================================================================================
 Eigen Chat Viewer
================================================================================
 Description : Single-file, offline viewer that renders exported Eigen Engineering
               Agent chat sessions (.txt) as a readable conversation: Markdown
               formatting, SCL syntax highlighting, copyable code blocks,
               collapsible tool activity, and selectable themes.
 Version     : 1.0.0
 Files       : ChatViewer.html (application), themes.js (theme definitions)
 Usage       : Open ChatViewer.html in a modern browser, then drop an exported
               .txt file onto the page or use "Open .txt". All processing is
               local; no data leaves your machine and no network access is used.
 Author      : Johnny Heng
 Authorship  : Created with AI assistance (GitHub Copilot CLI). Generated code
               has not been independently audited.
 License     : Open source, released under the MIT License. Free to use, copy,
               modify, and distribute, provided this notice is retained.
 Disclaimer  : PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
               IMPLIED. USE AT YOUR OWN RISK. The authors accept no liability
               for any damages arising from its use.
 Support     : No maintenance, updates, or support are provided or implied.
               Forks and modifications are welcome.
 Compat.     : Parses the Eigen export layout as of application version 1.5.x.
               Future export format changes may break parsing.
================================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Eigen Chat Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#14161a;--panel:#1b1e24;--border:#2c313a;--text:#d4d7dd;--muted:#7d8591;--accent:#4da3ff;--gold:#d9a441;--code:#101216;--user-bg:#1a2230;--user-border:#28364d;--heading:#e6e8ec;--btn:#242933;--pre-text:#d4d4d4;--rail:#5a4a20;--asst:#6fd08c;--tk:#569cd6;--tc:#6a9955;--ts:#ce9178;--tn:#b5cea8;--tt:#4ec9b0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Segoe UI",system-ui,sans-serif}
header.top{position:sticky;top:0;z-index:10;display:flex;gap:12px;align-items:center;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--border)}
header.top .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
header.top .spacer{flex:1}
button,label.btn,select{background:var(--btn);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px}
button:hover,label.btn:hover{border-color:var(--accent)}
label.chk{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;cursor:pointer}
#drop{margin:15vh auto;max-width:560px;text-align:center;padding:48px 24px;border:2px dashed var(--border);border-radius:12px;color:var(--muted)}
#drop.over{border-color:var(--accent);color:var(--accent)}
#overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);pointer-events:none}
#overlay.show{display:flex}
#overlay div{padding:32px 56px;border:3px dashed var(--accent);border-radius:14px;background:var(--panel);color:var(--accent);font-size:22px;font-weight:600}
#drop h2{color:var(--text);margin-top:0}
#chat{max-width:1100px;margin:0 auto;padding:16px 24px 80px;border-left:2px dashed var(--rail);margin-left:max(24px,calc((100vw - 1100px)/2))}
.meta{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin:12px 0 20px;font-size:13px}
.meta h1{margin:0 0 6px;font-size:20px}
.meta div span{color:var(--muted);display:inline-block;min-width:130px}
.msg{padding:14px 0;border-bottom:1px solid var(--border)}
.msg .ts{color:var(--muted);font-size:12px;margin-bottom:6px}
.msg.user{background:var(--user-bg);border:1px solid var(--user-border);border-radius:8px;padding:12px 16px;margin:14px 0}
.msg.user .ts::before{content:"You  ·  ";color:var(--accent);font-weight:600}
.msg.assistant .ts::before{content:"Assistant  ·  ";color:var(--asst);font-weight:600}
.msg.assistant .ts{cursor:pointer;user-select:none;display:flex;gap:6px;align-items:baseline}
.msg.assistant .ts::after{content:"▾";order:-1;color:var(--gold)}
.msg.assistant.collapsed .ts::after{content:"▸"}
.msg.assistant .ts .pv{color:var(--muted);font-weight:400;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:none;flex:1}
.msg.assistant.collapsed .toolgroup{display:none}
details.toolgroup{margin:8px 0 8px 14px;border-left:2px solid var(--rail);padding-left:10px}
details.toolgroup>summary{cursor:pointer;font-size:12.5px;color:var(--muted);padding:2px 0}
details.toolgroup>summary b{color:var(--gold)}
details.toolgroup .inner{margin-top:4px}
.userText{white-space:pre-wrap;word-wrap:break-word}
.md h1,.md h2,.md h3,.md h4{line-height:1.3;margin:1.2em 0 .5em;font-weight:600;color:var(--heading)}
.md h1{font-size:1.7em}.md h2{font-size:1.45em}.md h3{font-size:1.2em}.md h4{font-size:1.05em}
.md p{margin:.6em 0}
.md ul,.md ol{padding-left:1.6em;margin:.5em 0}
.md li{margin:.2em 0}
.md hr{border:0;border-top:1px solid var(--border);margin:1.2em 0}
.md blockquote{margin:.6em 0;padding:2px 14px;border-left:3px solid var(--border);color:var(--muted)}
.md a{color:var(--accent)}
.md code{font:12.5px Consolas,"Cascadia Mono",monospace;background:var(--code);border:1px solid var(--border);border-radius:4px;padding:1px 5px}
.md table{border-collapse:collapse;margin:.8em 0;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--border);padding:5px 10px;text-align:left;vertical-align:top}
.md th{background:var(--panel)}
.codeblock{border:1px solid var(--border);border-radius:6px;margin:.8em 0;background:var(--code);overflow:hidden}
.codeblock .bar{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;border-bottom:1px solid var(--border);background:var(--panel);font-weight:600;font-size:13px}
.codeblock pre{margin:0;padding:10px 12px;overflow-x:auto;font:12.5px/1.5 Consolas,"Cascadia Mono",monospace;color:var(--pre-text);tab-size:4}
.codeblock pre code{background:none;border:0;padding:0;font:inherit}
.k{color:var(--tk)}.c{color:var(--tc);font-style:italic}.s{color:var(--ts)}.n{color:var(--tn)}.t{color:var(--tt)}
details.tool{margin:8px 0;border:1px solid var(--border);border-radius:6px;background:var(--panel)}
details.tool>summary{cursor:pointer;padding:5px 10px;font-size:12.5px;color:var(--muted);list-style:none}
details.tool>summary::before{content:"▸ ";color:var(--gold)}
details.tool[open]>summary::before{content:"▾ "}
details.tool>summary b{color:var(--gold);font-weight:600}
details.tool pre{margin:0;padding:8px 12px;max-height:420px;overflow:auto;border-top:1px solid var(--border);background:var(--code);font:12px/1.45 Consolas,monospace;white-space:pre-wrap;word-break:break-word}
body.hideTools details.toolgroup{display:none}
.empty{color:var(--muted);text-align:center;padding:40px}
</style>
</head>
<body>
<header class="top">
  <span class="title" id="title">Eigen Chat Viewer</span>
  <span class="spacer"></span>
  <select id="theme" title="Theme"></select>
  <label class="chk"><input type="checkbox" id="showTools" checked> Tool activity</label>
  <button id="expandReplies">Show tools</button>
  <button id="collapseReplies">Hide tools</button>
  <button id="expand">Expand tools</button>
  <button id="collapse">Collapse tools</button>
  <label class="btn">Open .txt<input type="file" id="file" accept=".txt,text/plain" hidden></label>
</header>

<div id="overlay"><div>Drop .txt file to open</div></div>
<div id="drop"><h2>Drop an exported chat .txt here</h2><p>or click “Open .txt” above. Files are read locally; nothing is uploaded.</p></div>
<main id="chat" hidden></main>

<script src="themes.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ---------- Themes (defined in themes.js) ---------- */
const THEMES=window.THEMES||[{id:"eigen-dark",name:"Eigen Dark (default)",vars:{}}];
const sel=$("theme");
const groups={};
for(const t of THEMES){const g=t.group||"Themes";(groups[g]=groups[g]||[]).push(t);}
for(const g in groups){
  const og=document.createElement("optgroup");og.label=g;
  for(const t of groups[g]){const o=document.createElement("option");o.value=t.id;o.textContent=t.name;og.appendChild(o);}
  sel.appendChild(og);
}
const base=getComputedStyle(document.documentElement);
const allKeys=new Set();THEMES.forEach(t=>Object.keys(t.vars).forEach(k=>allKeys.add(k)));
function applyTheme(id){
  const t=THEMES.find(x=>x.id===id)||THEMES[0];
  allKeys.forEach(k=>document.documentElement.style.removeProperty(k));
  Object.entries(t.vars).forEach(([k,v])=>document.documentElement.style.setProperty(k,v));
  sel.value=t.id;
  try{localStorage.setItem("chatViewerTheme",t.id);}catch(e){}
}
sel.addEventListener("change",()=>applyTheme(sel.value));
let saved=null;try{saved=localStorage.getItem("chatViewerTheme");}catch(e){}
applyTheme(saved||THEMES[0].id);

/* ---------- Parsing ---------- */
const HDR=/^\[(\d{4}-\d\d-\d\d \d\d:\d\d:\d\d)\] (User|Assistant|Tool Call|Tool Result)(?:: ?(.*))?$/;

function parse(text){
  text=text.replace(/^\uFEFF/,"").replace(/\r\n?/g,"\n");
  const lines=text.split("\n");
  const meta={};let i=0,start=lines.findIndex(l=>/^Messages:\s*$/.test(l));
  const headEnd=start>=0?start:lines.findIndex(l=>HDR.test(l));
  for(const l of lines.slice(0,headEnd<0?lines.length:headEnd)){
    const m=l.match(/^([A-Za-z][A-Za-z ]*?):\s*(.*)$/);
    if(m&&m[2])meta[m[1]]=m[2];
  }
  i=start>=0?start+1:0;
  if(lines[i]&&/^-{10,}$/.test(lines[i]))i++;
  const msgs=[];let cur=null;
  for(;i<lines.length;i++){
    const m=lines[i].match(HDR);
    if(m){
      cur={ts:m[1],role:m[2],name:(m[3]||"").trim(),lines:[]};
      msgs.push(cur);
    }else if(cur)cur.lines.push(lines[i]);
  }
  for(const m of msgs)m.body=m.lines.join("\n").replace(/^\n+|\s+$/g,"");
  return {meta,msgs};
}

/* ---------- SCL highlighting ---------- */
const KW="IF|THEN|ELSE|ELSIF|END_IF|CASE|OF|END_CASE|FOR|TO|BY|DO|END_FOR|WHILE|END_WHILE|REPEAT|UNTIL|END_REPEAT|CONTINUE|EXIT|RETURN|GOTO|AND|OR|XOR|NOT|MOD|TRUE|FALSE|FUNCTION|FUNCTION_BLOCK|END_FUNCTION|END_FUNCTION_BLOCK|ORGANIZATION_BLOCK|END_ORGANIZATION_BLOCK|DATA_BLOCK|END_DATA_BLOCK|BEGIN|VAR|VAR_INPUT|VAR_OUTPUT|VAR_IN_OUT|VAR_TEMP|VAR_STATIC|VAR_CONSTANT|END_VAR|STRUCT|END_STRUCT|TYPE|END_TYPE|REGION|END_REGION|VERSION|ARRAY|Void";
const TYPES="Bool|Byte|Word|DWord|LWord|Int|SInt|DInt|LInt|UInt|USInt|UDInt|ULInt|Real|LReal|Time|LTime|Date|Time_Of_Day|DTL|String|WString|Char|WChar|Variant|Struct";
const HL=new RegExp("(\\/\\/[^\\n]*|\\(\\*[\\s\\S]*?\\*\\))|(\"[^\"\\n]*\"|'[^'\\n]*')|\\b(\\d+(?:\\.\\d+)?(?:[eE][+-]?\\d+)?)\\b|\\b("+KW+")\\b|\\b("+TYPES+")\\b","gi");
function highlight(code,lang){
  if(lang&&!/^(scl|st|pascal|stl|awl|iecst|)$/i.test(lang))return esc(code);
  let out="",last=0,m;HL.lastIndex=0;
  while((m=HL.exec(code))){
    out+=esc(code.slice(last,m.index));
    const cls=m[1]?"c":m[2]?"s":m[3]?"n":m[4]?"k":"t";
    out+='<span class="'+cls+'">'+esc(m[0])+"</span>";
    last=m.index+m[0].length;
  }
  return out+esc(code.slice(last));
}

/* ---------- Markdown ---------- */
function inline(s){
  const codes=[];
  s=s.replace(/`([^`\n]+)`/g,(_,c)=>{codes.push(c);return "\u0000"+(codes.length-1)+"\u0000";});
  s=esc(s);
  s=s.replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/\*\*([^*\n]+?)\*\*|__([^_\n]+?)__/g,(_,a,b)=>"<strong>"+(a||b)+"</strong>");
  s=s.replace(/(^|[^*\w])\*([^*\s][^*\n]*?)\*(?!\w)/g,"$1<em>$2</em>");
  s=s.replace(/~~([^~\n]+)~~/g,"<del>$1</del>");
  return s.replace(/\u0000(\d+)\u0000/g,(_,n)=>"<code>"+esc(codes[+n])+"</code>");
}
function codeBlock(code,lang){
  return '<div class="codeblock"><div class="bar"><span>'+esc(lang||"Code")+'</span><button class="copy">Copy</button></div><pre><code>'+highlight(code,lang)+"</code></pre></div>";
}
function cells(l){return l.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());}
function markdown(src){
  const L=src.split("\n");let h="",i=0;
  const isBlockStart=l=>/^(#{1,6}\s|```|>\s?|\s*([-*+]|\d+[.)])\s|\s*([-*_]\s*){3,}$)/.test(l);
  while(i<L.length){
    let l=L[i];
    if(!l.trim()){i++;continue;}
    let m=l.match(/^\s*```+\s*([\w+-]*)/);
    if(m){const buf=[];i++;while(i<L.length&&!/^\s*```+\s*$/.test(L[i]))buf.push(L[i++]);i++;h+=codeBlock(buf.join("\n"),m[1]);continue;}
    if((m=l.match(/^(#{1,6})\s+(.*?)\s*#*$/))){h+="<h"+m[1].length+">"+inline(m[2])+"</h"+m[1].length+">";i++;continue;}
    if(/^\s*([-*_]\s*){3,}$/.test(l)){h+="<hr>";i++;continue;}
    if(/^\s*>/.test(l)){const buf=[];while(i<L.length&&/^\s*>/.test(L[i]))buf.push(L[i++].replace(/^\s*>\s?/,""));h+="<blockquote>"+markdown(buf.join("\n"))+"</blockquote>";continue;}
    if(/^\s*\|.*\|\s*$/.test(l)&&i+1<L.length&&/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(L[i+1])){
      const hd=cells(l);i+=2;const rows=[];
      while(i<L.length&&/^\s*\|.*\|\s*$/.test(L[i]))rows.push(cells(L[i++]));
      h+="<table><thead><tr>"+hd.map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>"+rows.map(r=>"<tr>"+r.map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table>";
      continue;
    }
    if((m=l.match(/^(\s*)([-*+]|\d+[.)])\s+/))){
      const ordered=/\d/.test(m[2]);const base=m[1].length;const items=[];
      while(i<L.length){
        const mm=L[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if(mm&&mm[1].length<=base+1&&/\d/.test(mm[2])===ordered){items.push(mm[3]);i++;}
        else if(mm&&mm[1].length>base+1){items[items.length-1]+="\n"+L[i].slice(base+2);i++;}
        else if(L[i].trim()&&/^\s{2,}\S/.test(L[i])&&items.length){items[items.length-1]+="\n"+L[i].trim();i++;}
        else if(!L[i].trim()&&i+1<L.length&&/^\s+([-*+]|\d+[.)])\s/.test(L[i+1])){i++;}
        else break;
      }
      h+=(ordered?"<ol>":"<ul>")+items.map(t=>"<li>"+(/\n/.test(t)?markdown(t).replace(/^<p>([\s\S]*?)<\/p>/,"$1"):inline(t))+"</li>").join("")+(ordered?"</ol>":"</ul>");
      continue;
    }
    const buf=[l];i++;
    while(i<L.length&&L[i].trim()&&!isBlockStart(L[i])&&!/^\s*\|.*\|\s*$/.test(L[i]))buf.push(L[i++]);
    h+="<p>"+inline(buf.join("\n")).replace(/\n/g,"<br>")+"</p>";
  }
  return h;
}

/* ---------- Rendering ---------- */
function prettyJson(t){try{return JSON.stringify(JSON.parse(t),null,2);}catch(e){return t;}}
function toolBlock(m){
  const d=document.createElement("details");d.className="tool";
  const sum=document.createElement("summary");
  const label=m.role==="Tool Call"?"Tool call":"Tool result";
  sum.innerHTML="<b>"+label+"</b> "+esc(m.name)+' <span style="opacity:.6">· '+m.ts.slice(11)+"</span>";
  d.appendChild(sum);
  let filled=false;
  d.addEventListener("toggle",()=>{
    if(!d.open||filled)return;filled=true;
    let b=m.body.replace(/^Input:\s*/,"");
    const pre=document.createElement("pre");
    const LIM=200000;
    pre.textContent=(m.role==="Tool Call"?prettyJson(b):b.length>LIM?b.slice(0,LIM)+"\n… ("+(b.length-LIM)+" more characters truncated)":b);
    d.appendChild(pre);
  });
  return d;
}
function render(data,fileName){
  const root=$("chat");root.innerHTML="";
  const {meta,msgs}=data;
  const title=meta["Chat Session"]||fileName;
  $("title").textContent=title;document.title=title+" – Eigen Chat Viewer";
  const mb=document.createElement("div");mb.className="meta";
  mb.innerHTML="<h1>"+esc(title)+"</h1>"+Object.entries(meta).filter(([k])=>k!=="Chat Session").map(([k,v])=>"<div><span>"+esc(k)+"</span>"+esc(v)+"</div>").join("");
  root.appendChild(mb);
  let shown=0,grp=null;
  const newGroup=m=>{
    const d=document.createElement("div");d.className="msg assistant collapsed";
    const ts=document.createElement("div");ts.className="ts";ts.textContent=m.ts;
    const pv=document.createElement("span");pv.className="pv";ts.appendChild(pv);
    ts.addEventListener("click",()=>d.classList.toggle("collapsed"));
    const body=document.createElement("div");body.className="abody";
    d.append(ts,body);root.appendChild(d);
    return grp={d,pv,body,tools:null,nTools:0,hasText:false};
  };
  for(const m of msgs){
    if(m.role==="User"){
      grp=null;
      if(!m.body)continue;
      const d=document.createElement("div");d.className="msg user";
      const ts=document.createElement("div");ts.className="ts";ts.textContent=m.ts;
      const b=document.createElement("div");b.className="userText";b.textContent=m.body;
      d.append(ts,b);root.appendChild(d);continue;
    }
    if(!grp)newGroup(m);
    if(m.role==="Assistant"){
      if(!m.body)continue;
      grp.tools=null;
      const b=document.createElement("div");b.className="md";b.innerHTML=markdown(m.body);
      grp.body.appendChild(b);
      if(!grp.hasText){grp.hasText=true;grp.pv.textContent="— "+m.body.replace(/```[\s\S]*?```/g," ").replace(/[#*`>|_-]+/g," ").replace(/\s+/g," ").trim().slice(0,160);}
      shown++;continue;
    }
    if(!grp.tools){
      const g=document.createElement("details");g.className="toolgroup";
      g.innerHTML="<summary></summary><div class=\"inner\"></div>";
      grp.body.appendChild(g);grp.tools=g;grp.nTools=0;
    }
    grp.tools.querySelector(".inner").appendChild(toolBlock(m));
    if(m.role==="Tool Call")grp.nTools++;
    grp.tools.querySelector("summary").innerHTML="<b>Tools</b> · "+grp.nTools+" call"+(grp.nTools===1?"":"s");
  }
  for(const g of root.querySelectorAll(".msg.assistant")){
    const pv=g.querySelector(".pv");
    if(!pv.textContent){const n=g.querySelectorAll(".toolgroup .tool").length;pv.textContent="— (tool activity only)";}
  }
  if(!msgs.length)root.insertAdjacentHTML("beforeend",'<div class="empty">No messages found. Is this an Eigen export?</div>');
  $("drop").hidden=true;root.hidden=false;window.scrollTo(0,0);
}
function loadFile(f){
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>render(parse(String(r.result)),f.name.replace(/\.txt$/i,""));
  r.readAsText(f,"utf-8");
}

/* ---------- Events ---------- */
$("file").addEventListener("change",e=>{loadFile(e.target.files[0]);e.target.value="";});
$("drop").addEventListener("click",()=>$("file").click());
["dragover","dragenter"].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();$("drop").classList.add("over");if(e.dataTransfer&&[...e.dataTransfer.types].includes("Files"))$("overlay").classList.add("show");}));
["dragleave","drop"].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();if(ev==="dragleave"&&e.relatedTarget)return;$("drop").classList.remove("over");$("overlay").classList.remove("show");}));
document.addEventListener("drop",e=>loadFile(e.dataTransfer.files[0]));
$("showTools").addEventListener("change",e=>document.body.classList.toggle("hideTools",!e.target.checked));
$("expandReplies").onclick=()=>document.querySelectorAll(".msg.assistant").forEach(d=>d.classList.remove("collapsed"));
$("collapseReplies").onclick=()=>document.querySelectorAll(".msg.assistant").forEach(d=>d.classList.add("collapsed"));
$("expand").onclick=()=>document.querySelectorAll("details.toolgroup,details.tool").forEach(d=>d.open=true);
$("collapse").onclick=()=>document.querySelectorAll("details.toolgroup,details.tool").forEach(d=>d.open=false);
document.addEventListener("click",e=>{
  if(!e.target.classList.contains("copy"))return;
  const code=e.target.closest(".codeblock").querySelector("code").textContent;
  navigator.clipboard.writeText(code).then(()=>{e.target.textContent="Copied";setTimeout(()=>e.target.textContent="Copy",1200);});
});
})();
</script>
</body>
</html>
